<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SPIN — Dynamic Glass LED Volume</title>
<style>
  html,body{margin:0;height:100%;background:#05060a;overflow:hidden;font-family:ui-monospace,Menlo,monospace}
  #info{position:fixed;left:12px;bottom:10px;color:#7fa8ff;font-size:11px;opacity:.7;z-index:10;line-height:1.5}
  #info b{color:#cfe0ff}
  a{color:#7fa8ff}
</style>
</head>
<body>
<div id="info">
  <b>SPIN Dynamic Glass LED Volume</b> — real-time GPU deformation · live JSON · glass + LED + video<br>
  drag = orbit · scroll = zoom · panel top-right = live params · <b>Export JSON</b> bakes config for the .py/GLB pipeline
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

// ---------------- live JSON config (the dynamic driver) -------------------
const CFG = {
  layers: 4, gap: 0.10, rectX: 3.0, rectY: 1.6, subdiv: 140,
  amp: 0.22, freq: 3.0, speed: 1.0, softness: 1.0, noise: 0.5,
  driver: 'softbody',                 // softbody | waves | heightmap | video
  color: '#0b3cff', roughness: 0.06, transmission: 0.92, ior: 1.45,
  ledOn: true, ledRes: 32, emissive: 1.4, autoRotate: true
};

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060a);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.01, 100);
camera.position.set(2.6, 1.7, 3.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.autoRotate = CFG.autoRotate; controls.autoRotateSpeed = 0.8;

// IBL for glass reflections
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.AmbientLight(0x224466, 0.4));
const key = new THREE.DirectionalLight(0xbfd4ff, 2.2); key.position.set(3,5,2); scene.add(key);

// ---------------- LED emissive texture (the pixels) -----------------------
function ledTexture(res){
  const S=512, c=document.createElement('canvas'); c.width=c.height=S;
  const x=c.getContext('2d'); x.fillStyle='#000'; x.fillRect(0,0,S,S);
  const cell=S/res;
  for(let j=0;j<res;j++)for(let i=0;i<res;i++){
    const h=(i/res), v=(j/res);
    const r=Math.floor(127+127*Math.sin(6.28*h));
    const g=Math.floor(127+127*Math.sin(6.28*v+2.1));
    const b=Math.floor(180+75*Math.sin(6.28*(h+v)+4.2));
    x.fillStyle=`rgb(${r},${g},${b})`;
    x.beginPath(); x.arc((i+0.5)*cell,(j+0.5)*cell,cell*0.36,0,6.2832); x.fill();
  }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
let ledTex = ledTexture(CFG.ledRes);

// optional video texture
let videoTex=null;
function makeVideoTexture(url){
  const v=document.createElement('video'); v.src=url; v.loop=true; v.muted=true; v.crossOrigin='anonymous'; v.play();
  const t=new THREE.VideoTexture(v); t.colorSpace=THREE.SRGBColorSpace; return t;
}

// ---------------- shared shader uniforms (real-time deform) ---------------
const U = {
  uTime:{value:0}, uAmp:{value:CFG.amp}, uFreq:{value:CFG.freq}, uSpeed:{value:CFG.speed},
  uSoft:{value:CFG.softness}, uNoise:{value:CFG.noise}, uDriver:{value:0},
  uRectX:{value:CFG.rectX}, uRectY:{value:CFG.rectY}, uLayer:{value:0}, uLayers:{value:CFG.layers}
};
const DRIVERS={softbody:0,waves:1,heightmap:2,video:3};

const DEFORM = /* glsl */`
uniform float uTime,uAmp,uFreq,uSpeed,uSoft,uNoise,uRectX,uRectY,uLayer,uLayers; uniform int uDriver;
// hash noise
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float field(vec2 uv,float t){
  float soft=1.0+uSoft*(uLayer/max(1.0,uLayers-1.0));
  float edge=sin(3.14159*uv.x)*sin(3.14159*uv.y);          // pinned edges
  if(uDriver==1){ // waves
    return uAmp*( sin(uv.x*uFreq*2.0+t*2.0)*0.5 + sin((uv.x+uv.y)*uFreq-t*2.4)*0.5 );
  } else if(uDriver==2){ // heightmap (radial ripple)
    vec2 c=uv-0.5; float r=length(c)*8.0; return uAmp*soft*edge*sin(r-t*4.0)*exp(-r*0.12);
  } else if(uDriver==3){ // video-ish plasma
    return uAmp*soft*edge*0.25*( sin(uv.x*10.+t)+sin(uv.y*10.-t)+sin((uv.x+uv.y)*8.+t) );
  }
  // softbody (default): low-freq jelly + noise
  float w1=sin(uv.x*uFreq+t*2.0)*cos(uv.y*(uFreq*0.8)-t*1.3);
  float w2=sin((uv.x+uv.y)*(uFreq*1.6)-t*2.4);
  float nz=(n2(uv*8.0+t*0.6)-0.5)*uNoise;
  return uAmp*soft*edge*(0.6*w1+0.3*w2+nz);
}
`;

function glassMaterial(layerIndex){
  const m=new THREE.MeshPhysicalMaterial({
    color:new THREE.Color(CFG.color), metalness:0.0, roughness:CFG.roughness,
    transmission:CFG.transmission, ior:CFG.ior, thickness:0.6,
    emissive:new THREE.Color(CFG.color), emissiveIntensity:CFG.ledOn?CFG.emissive:0.0,
    emissiveMap:ledTex, side:THREE.DoubleSide, transparent:true,
    attenuationColor:new THREE.Color(CFG.color), attenuationDistance:1.2,
    clearcoat:0.4, clearcoatRoughness:0.2
  });
  m.onBeforeCompile=(sh)=>{
    Object.assign(sh.uniforms,U); sh.uniforms.uLayer={value:layerIndex};
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\n'+DEFORM)
      .replace('#include <begin_vertex>', `
        #include <begin_vertex>
        float t=uTime*uSpeed;
        vec2 guv=vec2((position.x+uRectX*0.5)/uRectX,(position.y+uRectY*0.5)/uRectY);
        float e=0.004;
        float zc=field(guv,t);
        float zx=field(guv+vec2(e,0.0),t);
        float zy=field(guv+vec2(0.0,e),t);
        transformed.z += zc;
        // recompute normal from the height field
        vec3 dx=vec3(e*uRectX,0.0,zx-zc);
        vec3 dy=vec3(0.0,e*uRectY,zy-zc);
        objectNormal=normalize(mix(objectNormal,normalize(cross(dx,dy)),0.85));
        vNormal=normalize(normalMatrix*objectNormal);
      `);
    m.userData.sh=sh;
  };
  m.customProgramCacheKey=()=>'glassdeform'+layerIndex;
  return m;
}

let group=new THREE.Group(); scene.add(group);
function buildMesh(){
  group.clear();
  for(let li=0; li<CFG.layers; li++){
    const g=new THREE.PlaneGeometry(CFG.rectX,CFG.rectY,CFG.subdiv,Math.round(CFG.subdiv*CFG.rectY/CFG.rectX));
    const mesh=new THREE.Mesh(g, glassMaterial(li));
    mesh.position.z = (li-(CFG.layers-1)/2)*CFG.gap; // stacked along view depth
    mesh.rotation.x = -Math.PI/2*0.0;
    group.add(mesh);
  }
  group.rotation.x=-0.5; // tilt to read the layers
}
buildMesh();

// ---------------- GUI (live JSON-driven controls) -------------------------
const gui=new GUI({title:'SPIN · live config'});
const fd=gui.addFolder('motion');
fd.add(CFG,'driver',Object.keys(DRIVERS)).onChange(v=>U.uDriver.value=DRIVERS[v]);
fd.add(CFG,'amp',0,0.6).onChange(v=>U.uAmp.value=v);
fd.add(CFG,'freq',0.5,8).onChange(v=>U.uFreq.value=v);
fd.add(CFG,'speed',0,3).onChange(v=>U.uSpeed.value=v);
fd.add(CFG,'softness',0,2).onChange(v=>U.uSoft.value=v);
fd.add(CFG,'noise',0,1.5).onChange(v=>U.uNoise.value=v);
const fg=gui.addFolder('glass');
fg.addColor(CFG,'color').onChange(rebuildMats);
fg.add(CFG,'roughness',0,0.4).onChange(rebuildMats);
fg.add(CFG,'transmission',0,1).onChange(rebuildMats);
fg.add(CFG,'ior',1,2.0).onChange(rebuildMats);
const fl=gui.addFolder('LED');
fl.add(CFG,'ledOn').onChange(rebuildMats);
fl.add(CFG,'emissive',0,4).onChange(rebuildMats);
fl.add(CFG,'ledRes',8,64,1).onChange(()=>{ledTex=ledTexture(CFG.ledRes);rebuildMats();});
const fs=gui.addFolder('structure');
fs.add(CFG,'layers',1,8,1).onChange(buildMesh);
fs.add(CFG,'gap',0.02,0.4).onChange(buildMesh);
fs.add(CFG,'subdiv',40,220,1).onChange(buildMesh);
fs.add(CFG,'autoRotate').onChange(v=>controls.autoRotate=v);
gui.add({exportJSON(){ const b=new Blob([JSON.stringify(CFG,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='glass_led_config.json';a.click();}},'exportJSON').name('⬇ Export JSON config');
gui.add({loadVideo(){ const i=document.createElement('input');i.type='file';i.accept='video/*';
  i.onchange=e=>{const f=e.target.files[0];if(!f)return;videoTex=makeVideoTexture(URL.createObjectURL(f));CFG.driver='video';U.uDriver.value=3;rebuildMats();};i.click();}},'loadVideo').name('🎞 Load video → LED');

function rebuildMats(){
  group.children.forEach((mesh,li)=>{
    mesh.material.dispose();
    mesh.material=glassMaterial(li);
    if(CFG.driver==='video'&&videoTex){mesh.material.emissiveMap=videoTex;}
    mesh.material.needsUpdate=true;
  });
}

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const clock=new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);
  U.uTime.value+=clock.getDelta();
  controls.update();
  renderer.render(scene,camera);
})();
window.__ready=true;
</script>
</body>
</html>
