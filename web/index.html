<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>final-3d-solution-a · Instanced Glass LED Volume</title>
<style>
  html,body{margin:0;height:100%;background:#04050a;overflow:hidden;font-family:ui-monospace,Menlo,monospace}
  #hud{position:fixed;left:12px;bottom:10px;color:#7fa8ff;font-size:11px;opacity:.75;z-index:10;line-height:1.5}
  #hud b{color:#cfe0ff}
  #stat{position:fixed;left:12px;top:10px;color:#5f86cc;font-size:11px;opacity:.7;z-index:10}
</style>
</head>
<body>
<div id="stat"></div>
<div id="hud">
  <b>final-3d-solution-a</b> — instanced glass LED volume · real-time GPU deform · OpenPBR-style glass<br>
  drag = orbit · scroll = zoom · panel = live edit · <b>Export scene.json</b> drives the Blender/USD/UE bake
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

// ===== single source of truth (mirrors config/scene.json) =================
const S = {
  instancing: { countX:7, countY:5, countZ:3, spacing:0.62, phaseSpread:1.2, hueSpread:0.5 },
  unit:   { sizeX:0.5, sizeY:0.5, subdiv:36 },
  motion: { driver:'softbody', amp:0.16, freq:3.0, speed:1.0, softness:1.0, noise:0.5 },
  glass:  { color:'#0b3cff', roughness:0.06, transmission:0.9, ior:1.5, thickness:0.6,
            iridescence:0.5, clearcoat:0.6, attenuation:1.0 },
  led:    { on:true, res:24, emissive:1.6 },
  view:   { autoRotate:true, exposure:1.15 }
};
const DRIVERS = { softbody:0, waves:1, heightmap:2, video:3 };

// ===== renderer / scene ===================================================
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = S.view.exposure;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x04050a);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.01, 100);
camera.position.set(3.4, 2.2, 4.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.autoRotate = S.view.autoRotate; controls.autoRotateSpeed = 0.7;
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.AmbientLight(0x223355, 0.4));
const key = new THREE.DirectionalLight(0xbfd4ff, 2.4); key.position.set(3,6,2); scene.add(key);

// ===== LED emissive texture (pixels) ======================================
function ledTexture(res){
  const SZ=512, c=document.createElement('canvas'); c.width=c.height=SZ;
  const x=c.getContext('2d'); x.fillStyle='#000'; x.fillRect(0,0,SZ,SZ); const cell=SZ/res;
  for(let j=0;j<res;j++)for(let i=0;i<res;i++){
    x.fillStyle=`rgb(${(127+127*Math.sin(6.28*i/res))|0},${(127+127*Math.sin(6.28*j/res+2.1))|0},${(180+75*Math.sin(6.28*(i/res+j/res)+4.2))|0})`;
    x.beginPath(); x.arc((i+0.5)*cell,(j+0.5)*cell,cell*0.36,0,6.2832); x.fill();
  }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
let ledTex = ledTexture(S.led.res);
let videoTex=null;

// ===== shared deform shader (instanced) ===================================
const U = { uTime:{value:0}, uAmp:{value:0}, uFreq:{value:0}, uSpeed:{value:0},
  uSoft:{value:0}, uNoise:{value:0}, uDriver:{value:0}, uSizeX:{value:0}, uSizeY:{value:0} };
function syncU(){ U.uAmp.value=S.motion.amp; U.uFreq.value=S.motion.freq; U.uSpeed.value=S.motion.speed;
  U.uSoft.value=S.motion.softness; U.uNoise.value=S.motion.noise; U.uDriver.value=DRIVERS[S.motion.driver];
  U.uSizeX.value=S.unit.sizeX; U.uSizeY.value=S.unit.sizeY; }
syncU();

const DEFORM = /* glsl */`
uniform float uTime,uAmp,uFreq,uSpeed,uSoft,uNoise,uSizeX,uSizeY; uniform int uDriver;
attribute float aPhase;
float hsh(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hsh(i),hsh(i+vec2(1,0)),f.x),mix(hsh(i+vec2(0,1)),hsh(i+vec2(1,1)),f.x),f.y);}
float field(vec2 uv,float t){
  float edge=sin(3.14159*uv.x)*sin(3.14159*uv.y);
  if(uDriver==1) return uAmp*(sin(uv.x*uFreq*2.0+t*2.0)*0.5+sin((uv.x+uv.y)*uFreq-t*2.4)*0.5);
  if(uDriver==2){vec2 c=uv-0.5;float r=length(c)*8.0;return uAmp*edge*sin(r-t*4.0)*exp(-r*0.12);}
  if(uDriver==3) return uAmp*edge*0.25*(sin(uv.x*10.+t)+sin(uv.y*10.-t)+sin((uv.x+uv.y)*8.+t));
  float w1=sin(uv.x*uFreq+t*2.0)*cos(uv.y*(uFreq*0.8)-t*1.3);
  float w2=sin((uv.x+uv.y)*(uFreq*1.6)-t*2.4);
  float nz=(n2(uv*8.0+t*0.6)-0.5)*uNoise;
  return uAmp*(1.0+uSoft)*edge*(0.6*w1+0.3*w2+nz);
}`;

function glassMaterial(){
  const m=new THREE.MeshPhysicalMaterial({
    color:new THREE.Color(S.glass.color), metalness:0.0, roughness:S.glass.roughness,
    transmission:S.glass.transmission, ior:S.glass.ior, thickness:S.glass.thickness,
    iridescence:S.glass.iridescence, iridescenceIOR:1.3, clearcoat:S.glass.clearcoat, clearcoatRoughness:0.05,
    emissive:new THREE.Color(S.glass.color), emissiveIntensity:S.led.on?S.led.emissive:0.0, emissiveMap:ledTex,
    attenuationColor:new THREE.Color(S.glass.color), attenuationDistance:1.5/Math.max(0.001,S.glass.attenuation),
    side:THREE.DoubleSide, transparent:true
  });
  if(S.motion.driver==='video'&&videoTex) m.emissiveMap=videoTex;
  m.onBeforeCompile=(sh)=>{
    Object.assign(sh.uniforms,U);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>','#include <common>\n'+DEFORM)
      .replace('#include <begin_vertex>',`
        #include <begin_vertex>
        float t=uTime*uSpeed + aPhase;
        vec2 guv=vec2((position.x+uSizeX*0.5)/uSizeX,(position.y+uSizeY*0.5)/uSizeY);
        float e=0.01, zc=field(guv,t), zx=field(guv+vec2(e,0.),t), zy=field(guv+vec2(0.,e),t);
        transformed.z += zc;
        objectNormal=normalize(mix(objectNormal,normalize(cross(vec3(e*uSizeX,0.,zx-zc),vec3(0.,e*uSizeY,zy-zc))),0.85));
        vNormal=normalize(normalMatrix*objectNormal);`);
  };
  m.customProgramCacheKey=()=>'glassdeform_v2';
  return m;
}

// ===== instanced volume ===================================================
let inst=null;
function buildInstances(){
  if(inst){ scene.remove(inst); inst.geometry.dispose(); inst.material.dispose(); }
  const {countX,countY,countZ,spacing,phaseSpread,hueSpread}=S.instancing;
  const N=countX*countY*countZ;
  const g=new THREE.PlaneGeometry(S.unit.sizeX,S.unit.sizeY,S.unit.subdiv,S.unit.subdiv);
  const phase=new Float32Array(N);
  inst=new THREE.InstancedMesh(g, glassMaterial(), N);
  const dummy=new THREE.Object3D(); const col=new THREE.Color(); let k=0;
  const ox=(countX-1)/2, oy=(countY-1)/2, oz=(countZ-1)/2;
  for(let z=0;z<countZ;z++)for(let y=0;y<countY;y++)for(let x=0;x<countX;x++){
    dummy.position.set((x-ox)*spacing,(y-oy)*spacing,(z-oz)*spacing);
    dummy.rotation.set(-0.5,0,0); dummy.updateMatrix(); inst.setMatrixAt(k,dummy.matrix);
    phase[k]=((x+y*2+z*3)/N)*6.2831853*phaseSpread;
    col.set(S.glass.color).offsetHSL(((x+y+z)/N-0.5)*hueSpread,0,0); inst.setColorAt(k,col); k++;
  }
  g.setAttribute('aPhase', new THREE.InstancedBufferAttribute(phase,1));
  inst.instanceMatrix.needsUpdate=true; if(inst.instanceColor) inst.instanceColor.needsUpdate=true;
  scene.add(inst);
  document.getElementById('stat').textContent=`${N} instances · ${(N*(S.unit.subdiv+1)*(S.unit.subdiv+1)/1e3).toFixed(0)}k verts · GPU instanced`;
}
buildInstances();

// ===== GUI (editing) ======================================================
const gui=new GUI({title:'scene · live edit'});
const fi=gui.addFolder('instancing');
['countX','countY','countZ'].forEach(k=>fi.add(S.instancing,k,1,12,1).onChange(buildInstances));
fi.add(S.instancing,'spacing',0.2,1.5).onChange(buildInstances);
fi.add(S.instancing,'phaseSpread',0,3).onChange(buildInstances);
fi.add(S.instancing,'hueSpread',0,1.5).onChange(buildInstances);
const fm=gui.addFolder('motion');
fm.add(S.motion,'driver',Object.keys(DRIVERS)).onChange(()=>{syncU();rebuild();});
fm.add(S.motion,'amp',0,0.5).onChange(syncU);
fm.add(S.motion,'freq',0.5,8).onChange(syncU);
fm.add(S.motion,'speed',0,3).onChange(syncU);
fm.add(S.motion,'softness',0,2).onChange(syncU);
fm.add(S.motion,'noise',0,1.5).onChange(syncU);
const fg=gui.addFolder('glass (OpenPBR-style)');
fg.addColor(S.glass,'color').onChange(rebuild);
fg.add(S.glass,'roughness',0,0.4).onChange(rebuild);
fg.add(S.glass,'transmission',0,1).onChange(rebuild);
fg.add(S.glass,'ior',1,2).onChange(rebuild);
fg.add(S.glass,'iridescence',0,1).onChange(rebuild);
fg.add(S.glass,'clearcoat',0,1).onChange(rebuild);
fg.add(S.glass,'attenuation',0.2,3).onChange(rebuild);
const fl=gui.addFolder('LED');
fl.add(S.led,'on').onChange(rebuild);
fl.add(S.led,'emissive',0,4).onChange(rebuild);
fl.add(S.led,'res',8,48,1).onChange(()=>{ledTex=ledTexture(S.led.res);rebuild();});
gui.add(S.view,'autoRotate').onChange(v=>controls.autoRotate=v);
gui.add({ loadVideo(){ const i=document.createElement('input'); i.type='file'; i.accept='video/*';
  i.onchange=e=>{const f=e.target.files[0]; if(!f)return; const v=document.createElement('video');
    v.src=URL.createObjectURL(f); v.loop=v.muted=true; v.play(); videoTex=new THREE.VideoTexture(v);
    videoTex.colorSpace=THREE.SRGBColorSpace; S.motion.driver='video'; syncU(); rebuild();}; i.click(); }},'loadVideo').name('🎞 Load video → LED');
gui.add({ exportScene(){ const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='scene.json'; a.click(); }},'exportScene').name('⬇ Export scene.json');

function rebuild(){ buildInstances(); }

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const clock=new THREE.Clock();
(function loop(){ requestAnimationFrame(loop); U.uTime.value+=clock.getDelta(); controls.update(); renderer.render(scene,camera); })();
window.__ready=true;
</script>
</body>
</html>
