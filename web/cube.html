<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>final-3d-solution-a · Single-Block Glass LED Cube</title>
<style>
  html,body{margin:0;height:100%;background:#04050a;overflow:hidden;font-family:ui-monospace,Menlo,monospace}
  #hud{position:fixed;left:12px;bottom:10px;color:#7fa8ff;font-size:11px;opacity:.75;z-index:10;line-height:1.5}
  #hud b{color:#cfe0ff} #stat{position:fixed;left:12px;top:10px;color:#5f86cc;font-size:11px;opacity:.7;z-index:10}
</style>
</head>
<body>
<div id="stat"></div>
<div id="hud">
  <b>final-3d-solution-a · single-block cube</b> — ONE solid glass rectangle, real-time GPU deform<br>
  drag = orbit · scroll = zoom · panel = live edit · same stack as the instanced version, one mesh
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

// single source of truth (same schema as scene.json, minus instancing)
const S = {
  box:    { sizeX:2.4, sizeY:1.4, sizeZ:0.8, subdiv:80 },
  motion: { driver:'softbody', amp:0.16, freq:2.5, speed:1.0, softness:1.0, noise:0.5 },
  glass:  { color:'#0b3cff', roughness:0.06, transmission:0.9, ior:1.5, thickness:0.8,
            iridescence:0.5, clearcoat:0.6, attenuation:1.0 },
  led:    { on:true, res:24, emissive:1.6 },
  view:   { autoRotate:true }
};
const DRIVERS={softbody:0,waves:1,heightmap:2,video:3};

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x04050a);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.01,100); camera.position.set(3.2,2.0,4.0);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true;
controls.autoRotate=S.view.autoRotate; controls.autoRotateSpeed=0.7;
const pmrem=new THREE.PMREMGenerator(renderer); scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.AmbientLight(0x223355,0.4));
const key=new THREE.DirectionalLight(0xbfd4ff,2.4); key.position.set(3,6,2); scene.add(key);

function ledTexture(res){
  const SZ=512,c=document.createElement('canvas');c.width=c.height=SZ;const x=c.getContext('2d');
  x.fillStyle='#000';x.fillRect(0,0,SZ,SZ);const cell=SZ/res;
  for(let j=0;j<res;j++)for(let i=0;i<res;i++){
    x.fillStyle=`rgb(${(127+127*Math.sin(6.28*i/res))|0},${(127+127*Math.sin(6.28*j/res+2.1))|0},${(180+75*Math.sin(6.28*(i/res+j/res)+4.2))|0})`;
    x.beginPath();x.arc((i+0.5)*cell,(j+0.5)*cell,cell*0.36,0,6.2832);x.fill();
  }
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
let ledTex=ledTexture(S.led.res), videoTex=null;

const U={uTime:{value:0},uAmp:{value:0},uFreq:{value:0},uSpeed:{value:0},uSoft:{value:0},uNoise:{value:0},uDriver:{value:0},uLed:{value:0}};
function syncU(){U.uAmp.value=S.motion.amp;U.uFreq.value=S.motion.freq;U.uSpeed.value=S.motion.speed;
  U.uSoft.value=S.motion.softness;U.uNoise.value=S.motion.noise;U.uDriver.value=DRIVERS[S.motion.driver];U.uLed.value=S.led.res;}
syncU();

// 3D field — displaces the WHOLE block along its surface normal; triplanar LED emissive
const DEFORM=/* glsl */`
uniform float uTime,uAmp,uFreq,uSpeed,uSoft,uNoise,uLed; uniform int uDriver;
varying vec3 vLocalPos; varying vec3 vLocalN;
float hsh(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
float n3(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(mix(hsh(i),hsh(i+vec3(1,0,0)),f.x),mix(hsh(i+vec3(0,1,0)),hsh(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hsh(i+vec3(0,0,1)),hsh(i+vec3(1,0,1)),f.x),mix(hsh(i+vec3(0,1,1)),hsh(i+vec3(1,1,1)),f.x),f.y),f.z);}
float field3(vec3 p,float t){
  if(uDriver==1) return uAmp*(sin(p.x*uFreq+t*2.0)+sin(p.y*uFreq-t*1.7)+sin(p.z*uFreq+t*2.3))/3.0;
  if(uDriver==2) return uAmp*sin(length(p)*uFreq*1.5-t*4.0)*exp(-length(p)*0.2);
  if(uDriver==3) return uAmp*0.3*(sin(p.x*8.+t)+sin(p.y*8.-t)+sin(p.z*8.+t));
  float w=sin(p.x*uFreq+t*2.0)*cos(p.y*uFreq*0.8-t*1.3)+sin((p.x+p.z)*uFreq*1.3-t*2.1);
  float nz=(n3(p*3.0+t*0.4)-0.5)*uNoise;
  return uAmp*(1.0+uSoft)*(0.6*w+nz);
}`;

function glassMaterial(){
  const m=new THREE.MeshPhysicalMaterial({
    color:new THREE.Color(S.glass.color),metalness:0,roughness:S.glass.roughness,
    transmission:S.glass.transmission,ior:S.glass.ior,thickness:S.glass.thickness,
    iridescence:S.glass.iridescence,iridescenceIOR:1.3,clearcoat:S.glass.clearcoat,clearcoatRoughness:0.05,
    emissive:new THREE.Color(S.glass.color),emissiveIntensity:S.led.on?S.led.emissive:0.0,emissiveMap:ledTex,
    attenuationColor:new THREE.Color(S.glass.color),attenuationDistance:1.5/Math.max(0.001,S.glass.attenuation),
    side:THREE.DoubleSide,transparent:true
  });
  if(S.motion.driver==='video'&&videoTex)m.emissiveMap=videoTex;
  m.onBeforeCompile=(sh)=>{
    Object.assign(sh.uniforms,U);
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\nvarying vec3 vLocalPos;varying vec3 vLocalN;\n'+DEFORM.replace('varying vec3 vLocalPos; varying vec3 vLocalN;',''))
      .replace('#include <begin_vertex>',`
        #include <begin_vertex>
        float t=uTime*uSpeed; vLocalPos=position; vLocalN=normal;
        transformed += normal * field3(position,t);`);
    // triplanar LED emissive based on local position so the pixels wrap the whole block
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>','#include <common>\nvarying vec3 vLocalPos;varying vec3 vLocalN;uniform float uLed;')
      .replace('#include <emissivemap_fragment>',`
        vec3 an=abs(normalize(vLocalN)); an/=(an.x+an.y+an.z);
        vec2 uvX=vLocalPos.yz, uvY=vLocalPos.xz, uvZ=vLocalPos.xy;
        vec4 ex=texture2D(emissiveMap,uvX), ey=texture2D(emissiveMap,uvY), ez=texture2D(emissiveMap,uvZ);
        totalEmissiveRadiance *= (ex.rgb*an.x+ey.rgb*an.y+ez.rgb*an.z);`);
  };
  m.customProgramCacheKey=()=>'cubeglass_v1';
  return m;
}

let mesh=null;
function build(){
  if(mesh){scene.remove(mesh);mesh.geometry.dispose();mesh.material.dispose();}
  const g=new THREE.BoxGeometry(S.box.sizeX,S.box.sizeY,S.box.sizeZ,S.box.subdiv,Math.round(S.box.subdiv*S.box.sizeY/S.box.sizeX),Math.round(S.box.subdiv*S.box.sizeZ/S.box.sizeX));
  mesh=new THREE.Mesh(g,glassMaterial()); scene.add(mesh);
  document.getElementById('stat').textContent=`1 solid block · ${(g.attributes.position.count/1e3).toFixed(0)}k verts · single-mesh GPU deform`;
}
build();

const gui=new GUI({title:'single block · live edit'});
const fb=gui.addFolder('dimensions');
['sizeX','sizeY','sizeZ'].forEach(k=>fb.add(S.box,k,0.3,4).onChange(build));
fb.add(S.box,'subdiv',20,160,1).onChange(build);
const fm=gui.addFolder('motion');
fm.add(S.motion,'driver',Object.keys(DRIVERS)).onChange(()=>{syncU();build();});
['amp','freq','speed','softness','noise'].forEach(k=>fm.add(S.motion,k,0,k==='freq'?8:(k==='amp'?0.5:3)).onChange(syncU));
const fg=gui.addFolder('glass (OpenPBR-style)');
fg.addColor(S.glass,'color').onChange(build);
['roughness','transmission','ior','iridescence','clearcoat','attenuation'].forEach(k=>fg.add(S.glass,k,k==='ior'?1:0,k==='roughness'?0.4:(k==='ior'?2:(k==='attenuation'?3:1))).onChange(build));
const fl=gui.addFolder('LED');
fl.add(S.led,'on').onChange(build); fl.add(S.led,'emissive',0,4).onChange(build);
fl.add(S.led,'res',8,48,1).onChange(()=>{ledTex=ledTexture(S.led.res);syncU();build();});
gui.add(S.view,'autoRotate').onChange(v=>controls.autoRotate=v);
gui.add({loadVideo(){const i=document.createElement('input');i.type='file';i.accept='video/*';
  i.onchange=e=>{const f=e.target.files[0];if(!f)return;const v=document.createElement('video');v.src=URL.createObjectURL(f);
    v.loop=v.muted=true;v.play();videoTex=new THREE.VideoTexture(v);videoTex.colorSpace=THREE.SRGBColorSpace;
    videoTex.wrapS=videoTex.wrapT=THREE.RepeatWrapping;S.motion.driver='video';syncU();build();};i.click();}},'loadVideo').name('🎞 Load video → LED');
gui.add({exportScene(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='cube_scene.json';a.click();}},'exportScene').name('⬇ Export scene.json');

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const clock=new THREE.Clock();
(function loop(){requestAnimationFrame(loop);U.uTime.value+=clock.getDelta();controls.update();renderer.render(scene,camera);})();
window.__ready=true;
</script>
</body>
</html>
