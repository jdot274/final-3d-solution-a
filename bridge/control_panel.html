<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neural Wave — Live Material Editor</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #05060d;
        color: #cfe9ff;
        font:
          12px/1.5 'Courier New',
          monospace;
        height: 100vh;
        overflow: hidden;
        display: grid;
        grid-template-columns: 320px 1fr;
      }
      /* ── PANEL ── */
      #panel {
        background: linear-gradient(180deg, #0a0e1c, #070912);
        border-right: 1px solid #16304d;
        overflow-y: auto;
        padding: 14px;
      }
      #panel h1 {
        font-size: 13px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #39e6ff;
        margin-bottom: 4px;
      }
      #panel .sub {
        font-size: 10px;
        color: #4a6a8a;
        margin-bottom: 14px;
      }
      .group {
        border: 1px solid #16304d;
        border-radius: 6px;
        margin-bottom: 12px;
      }
      .group > .title {
        background: #0e1a2e;
        padding: 6px 10px;
        font-size: 11px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #6fb6ff;
        cursor: pointer;
        user-select: none;
      }
      .group .body {
        padding: 8px 10px;
      }
      .row {
        margin-bottom: 9px;
      }
      .row label {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: #9cc4e6;
        margin-bottom: 2px;
      }
      .row label .val {
        color: #39e6ff;
      }
      input[type='range'] {
        width: 100%;
        accent-color: #2bb8ff;
        height: 14px;
      }
      input[type='color'] {
        width: 100%;
        height: 22px;
        border: none;
        background: none;
        cursor: pointer;
      }
      /* ── LAYERS ── */
      .layer {
        border: 1px solid #1c3a5c;
        border-radius: 5px;
        padding: 6px 8px;
        margin-bottom: 7px;
        background: #0b1726;
      }
      .layer .lhead {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 5px;
      }
      .layer .lhead .nm {
        flex: 1;
        color: #aee0ff;
        font-size: 11px;
      }
      select,
      input[type='text'] {
        width: 100%;
        background: #0a1420;
        border: 1px solid #1c3a5c;
        color: #cfe9ff;
        font-family: inherit;
        font-size: 10px;
        padding: 3px 5px;
        border-radius: 3px;
      }
      .btns {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      button {
        flex: 1;
        background: #123;
        border: 1px solid #2bb8ff;
        color: #39e6ff;
        font-family: inherit;
        font-size: 10px;
        padding: 6px;
        border-radius: 4px;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      button:hover {
        background: #1b3a52;
      }
      #status {
        font-size: 9px;
        color: #4a6a8a;
        margin-top: 8px;
        word-break: break-all;
      }
      /* ── VIEWPORT ── */
      #view {
        position: relative;
      }
      canvas {
        display: block;
      }
      #hud {
        position: absolute;
        top: 12px;
        left: 12px;
        font-size: 10px;
        color: #4a6a8a;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <!-- ════════ PANEL ════════ -->
    <div id="panel">
      <h1>Neural Wave Editor</h1>
      <div class="sub">live → HTTP/JSON → UE5 · Blender · web</div>
      <div id="controls"></div>

      <div class="group">
        <div class="title">Layers · blend modes</div>
        <div class="body" id="layers"></div>
      </div>

      <div class="btns">
        <button id="reset">Reset</button>
        <button id="copy">Copy JSON</button>
      </div>
      <div id="status">connecting…</div>
    </div>

    <!-- ════════ VIEWPORT ════════ -->
    <div id="view">
      <div id="hud">LIVE PREVIEW · drag orbit · scroll zoom</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
    <script>
      // ── Determine bridge base (same origin if served by param_server) ──
      const BASE = location.protocol.startsWith('http')
        ? ''
        : 'http://localhost:8787';

      // Slider definitions: [group, key, min, max, step]
      const SLIDERS = {
        Mesh: [
          ['mesh', 'wave_speed', 0, 10, 0.01],
          ['mesh', 'wave_amplitude', 0, 5, 0.01],
          ['mesh', 'wave_decay', 0, 1, 0.001],
          ['mesh', 'wave_frequency', 0.1, 8, 0.01],
          ['mesh', 'displacement', 0, 200, 0.5],
        ],
        Material: [
          ['material', 'ior', 1, 2.5, 0.01],
          ['material', 'roughness', 0, 1, 0.001],
          ['material', 'metallic', 0, 1, 0.01],
          ['material', 'transmission', 0, 1, 0.01],
          ['material', 'thickness', 0, 10, 0.05],
          ['material', 'clearcoat', 0, 1, 0.01],
          ['material', 'iridescence', 0, 1, 0.01],
          ['material', 'irid_thickness', 100, 1000, 1],
          ['material', 'emission_strength', 0, 20, 0.1],
          ['material', 'opacity', 0, 1, 0.01],
        ],
      };
      const COLORS = [
        ['material', 'base_color'],
        ['material', 'emission_color'],
      ];

      let state = null;
      let putTimer = null;

      // ── Build controls ──
      const controlsEl = document.getElementById('controls');
      function buildControls() {
        controlsEl.innerHTML = '';
        for (const [groupName, defs] of Object.entries(SLIDERS)) {
          const g = document.createElement('div');
          g.className = 'group';
          g.innerHTML = `<div class="title">${groupName}</div>`;
          const body = document.createElement('div');
          body.className = 'body';
          for (const [grp, key, min, max, step] of defs) {
            const row = document.createElement('div');
            row.className = 'row';
            const v = state[grp][key];
            row.innerHTML = `
              <label>${key}<span class="val" id="v_${grp}_${key}">${(+v).toFixed(3)}</span></label>
              <input type="range" min="${min}" max="${max}" step="${step}" value="${v}"
                     data-g="${grp}" data-k="${key}">`;
            body.appendChild(row);
          }
          // color pickers in Material group
          if (groupName === 'Material') {
            for (const [grp, key] of COLORS) {
              const c = state[grp][key];
              const hex = rgbToHex(c);
              const row = document.createElement('div');
              row.className = 'row';
              row.innerHTML = `
                <label>${key}</label>
                <input type="color" value="${hex}" data-g="${grp}" data-k="${key}" data-color="1">`;
              body.appendChild(row);
            }
          }
          g.appendChild(body);
          controlsEl.appendChild(g);
        }
        // wire events
        controlsEl.querySelectorAll('input[type=range]').forEach(el => {
          el.oninput = () => {
            const g = el.dataset.g,
              k = el.dataset.k;
            state[g][k] = parseFloat(el.value);
            document.getElementById(`v_${g}_${k}`).textContent = parseFloat(
              el.value,
            ).toFixed(3);
            pushDebounced();
            applyToPreview();
          };
        });
        controlsEl.querySelectorAll('input[data-color]').forEach(el => {
          el.oninput = () => {
            const g = el.dataset.g,
              k = el.dataset.k;
            state[g][k] = hexToRgb(el.value);
            pushDebounced();
            applyToPreview();
          };
        });
      }

      // ── Layers UI ──
      const layersEl = document.getElementById('layers');
      const BLEND = [
        'normal',
        'add',
        'multiply',
        'screen',
        'overlay',
        'subtract',
      ];
      function buildLayers() {
        layersEl.innerHTML = '';
        (state.layers || []).forEach((L, i) => {
          const d = document.createElement('div');
          d.className = 'layer';
          d.innerHTML = `
            <div class="lhead">
              <input type="checkbox" ${L.enabled ? 'checked' : ''} data-i="${i}" data-f="enabled">
              <span class="nm">${L.name}</span>
            </div>
            <select data-i="${i}" data-f="blend_mode">
              ${BLEND.map(b => `<option ${b === L.blend_mode ? 'selected' : ''}>${b}</option>`).join('')}
            </select>
            <div class="row" style="margin-top:5px">
              <label>opacity<span class="val">${(+L.opacity).toFixed(2)}</span></label>
              <input type="range" min="0" max="1" step="0.01" value="${L.opacity}" data-i="${i}" data-f="opacity">
            </div>
            <input type="text" placeholder="texture / video / exr / svg url"
                   value="${L.texture || ''}" data-i="${i}" data-f="texture">`;
          layersEl.appendChild(d);
        });
        layersEl
          .querySelectorAll('input,select')
          .forEach(el => (el.onchange = el.oninput = layerEdit));
      }
      function layerEdit(e) {
        const el = e.target,
          i = +el.dataset.i,
          f = el.dataset.f;
        let val =
          el.type === 'checkbox'
            ? el.checked
            : el.type === 'range'
              ? parseFloat(el.value)
              : el.value;
        state.layers[i][f] = val;
        pushDebounced();
      }

      // ── Colour helpers ──
      function rgbToHex(c) {
        const h = x =>
          (
            '0' + Math.round(Math.min(1, Math.max(0, x)) * 255).toString(16)
          ).slice(-2);
        return `#${h(c[0])}${h(c[1])}${h(c[2])}`;
      }
      function hexToRgb(h) {
        return [
          parseInt(h.slice(1, 3), 16) / 255,
          parseInt(h.slice(3, 5), 16) / 255,
          parseInt(h.slice(5, 7), 16) / 255,
        ];
      }

      // ── Networking ──
      function pushDebounced() {
        clearTimeout(putTimer);
        putTimer = setTimeout(push, 60);
      }
      async function push() {
        try {
          await fetch(BASE + '/params', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(state),
          });
          status('pushed ✓ ' + new Date().toLocaleTimeString());
        } catch (e) {
          status('offline — preview only');
        }
      }
      function status(s) {
        document.getElementById('status').textContent = s;
      }

      // ── Live SSE from other clients ──
      function connectSSE() {
        try {
          const es = new EventSource(BASE + '/events');
          es.addEventListener('param', ev => {
            const incoming = JSON.parse(ev.data);
            // only adopt if changed externally
            state = incoming;
            buildControls();
            buildLayers();
            applyToPreview();
          });
          es.onerror = () => status('SSE reconnecting…');
        } catch (e) {}
      }

      document.getElementById('reset').onclick = async () => {
        await fetch(BASE + '/params/reset', { method: 'POST' }).catch(() => {});
        load();
      };
      document.getElementById('copy').onclick = () => {
        navigator.clipboard.writeText(JSON.stringify(state, null, 2));
        status('JSON copied to clipboard');
      };

      // ════════ THREE.JS PREVIEW ════════
      const view = document.getElementById('view');
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      view.appendChild(renderer.domElement);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x05060d);
      const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
      camera.position.set(0, -9, 6);
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      const N = 96;
      const geo = new THREE.PlaneGeometry(10, 10, N - 1, N - 1);
      const uni = {
        uTime: { value: 0 },
        uSpeed: { value: 2 },
        uAmp: { value: 1 },
        uDecay: { value: 0.25 },
        uFreq: { value: 1 },
        uBase: { value: new THREE.Color(0, 0.1, 0.42) },
        uEmis: { value: new THREE.Color(0.05, 0.45, 1) },
        uEmisStr: { value: 2.5 },
        uRough: { value: 0.06 },
        uOpacity: { value: 0.92 },
        uIrid: { value: 0.4 },
      };
      const mat = new THREE.ShaderMaterial({
        uniforms: uni,
        transparent: true,
        side: THREE.DoubleSide,
        vertexShader: `
          uniform float uTime,uSpeed,uAmp,uDecay,uFreq;
          varying float vH; varying vec3 vN;
          float w(vec2 p){ float r=length(p);
            return (sin(uFreq*6.2831*r-uTime*uSpeed)*exp(-uDecay*r))*uAmp; }
          void main(){ vec3 pos=position; float z=w(pos.xy); pos.z=z; vH=z;
            float e=0.05; vec3 t=vec3(e,0.,w(pos.xy+vec2(e,0.))-z);
            vec3 b=vec3(0.,e,w(pos.xy+vec2(0.,e))-z); vN=normalize(cross(t,b));
            gl_Position=projectionMatrix*modelViewMatrix*vec4(pos,1.); }`,
        fragmentShader: `
          uniform vec3 uBase,uEmis; uniform float uEmisStr,uRough,uOpacity,uIrid;
          varying float vH; varying vec3 vN;
          void main(){ vec3 L=normalize(vec3(0.5,0.6,1.));
            float d=max(dot(normalize(vN),L),0.);
            float spec=pow(d,mix(4.,128.,1.-uRough));
            float h=smoothstep(-1.,1.,vH);
            vec3 irid=vec3(0.5+0.5*cos(vH*8.+0.),0.5+0.5*cos(vH*8.+2.),0.5+0.5*cos(vH*8.+4.));
            vec3 col=uBase*(0.3+0.7*d)+spec*vec3(0.6,0.85,1.)
                    +uEmis*uEmisStr*0.15*h + irid*uIrid*h*0.4;
            gl_FragColor=vec4(col,uOpacity); }`,
      });
      scene.add(new THREE.Mesh(geo, mat));

      function applyToPreview() {
        if (!state) return;
        uni.uSpeed.value = state.mesh.wave_speed;
        uni.uAmp.value = state.mesh.wave_amplitude;
        uni.uDecay.value = state.mesh.wave_decay;
        uni.uFreq.value = state.mesh.wave_frequency;
        uni.uRough.value = state.material.roughness;
        uni.uOpacity.value = state.material.opacity;
        uni.uEmisStr.value = state.material.emission_strength;
        uni.uIrid.value = state.material.iridescence;
        uni.uBase.value.setRGB(...state.material.base_color);
        uni.uEmis.value.setRGB(...state.material.emission_color);
      }

      function resize() {
        const w = view.clientWidth,
          h = view.clientHeight;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      window.addEventListener('resize', resize);

      const clock = new THREE.Clock();
      function loop() {
        requestAnimationFrame(loop);
        uni.uTime.value = clock.getElapsedTime();
        controls.update();
        renderer.render(scene, camera);
      }

      // ── Boot ──
      async function load() {
        try {
          const r = await fetch(BASE + '/params');
          state = await r.json();
          status('connected');
        } catch (e) {
          // offline fallback defaults
          state = {
            mesh: {
              wave_speed: 2,
              wave_amplitude: 1,
              wave_decay: 0.25,
              wave_frequency: 1,
              displacement: 40,
            },
            material: {
              ior: 1.5,
              roughness: 0.06,
              metallic: 0,
              transmission: 0.85,
              thickness: 1.2,
              clearcoat: 0.6,
              iridescence: 0.4,
              irid_thickness: 380,
              emission_strength: 2.5,
              opacity: 0.92,
              base_color: [0, 0.1, 0.42],
              emission_color: [0.05, 0.45, 1],
            },
            layers: [
              {
                name: 'base_wave',
                enabled: true,
                blend_mode: 'normal',
                opacity: 1,
              },
              {
                name: 'led_glow',
                enabled: true,
                blend_mode: 'add',
                opacity: 0.8,
              },
              {
                name: 'iridescence',
                enabled: true,
                blend_mode: 'screen',
                opacity: 0.4,
              },
            ],
          };
          status('offline — preview only (start param_server.py)');
        }
        buildControls();
        buildLayers();
        applyToPreview();
      }

      resize();
      load().then(() => {
        connectSSE();
        loop();
      });
    </script>
  </body>
</html>
